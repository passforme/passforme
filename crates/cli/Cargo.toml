[package]
name = "passforme"
description = "Password manager client: the only place where the vault is decrypted"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["password-manager", "cli", "security", "totp", "self-hosted"]
categories = ["command-line-utilities", "authentication", "cryptography"]

[[bin]]
name = "passforme"
path = "src/main.rs"

[dependencies]
base64ct = "1.8.3"
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
clap_complete = "4"
getrandom = { version = "0.4.3", features = ["sys_rng"] }
rand_core = "0.10.1"
rpassword = "7.5.4"
rustix = { version = "1.1.5", features = ["fs", "process", "net"] }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
passforme-core = { path = "../core", version = "0.1.0" }
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
zeroize = "1.9.0"

[lints]
workspace = true
