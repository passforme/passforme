[package]
name = "passforme-core"
description = "Vault format, cryptography and password generator; no network, no disk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[dependencies]
argon2 = { version = "0.6.0", default-features = false, features = ["zeroize"] }
base64ct = { version = "1.8.3", features = ["alloc"] }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["zeroize"] }
hkdf = "0.13.0"
hmac = "0.13.0"
rand_core = "0.10.1"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = { version = "0.11.0", features = ["zeroize"] }
sha2 = { version = "0.11.0", features = ["zeroize"] }
unicode-normalization = "0.1.25"
zeroize = { version = "1.9.0", features = ["derive"] }

[dev-dependencies]
getrandom = { version = "0.4.3", features = ["sys_rng"] }
